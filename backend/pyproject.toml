[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sutram"
version = "1.0.0"
description = "AI-Powered Multimedia Forensics Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kartikey", email = "abracabramaster4@gmail.com" },
    { name = "Shivendra" },
    { name = "Saksham" },
    { name = "Saarika" },
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.2",
    "pillow>=10.4.0",
    "imagehash>=4.3.1",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.13.0",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-Pillow",
    "types-passlib",
    "types-python-jose",
]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.44.0",
    "opencv-python-headless>=4.10.0",
    "librosa>=0.10.2",
    "mediapipe>=0.10.14",
    "soundfile>=0.12.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]

