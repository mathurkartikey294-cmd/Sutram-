name: SUTRAM CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install system dependencies (ffmpeg, libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmagic1

      - name: Install backend dependencies
        run: |
          uv pip install --system -e "backend[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend

      - name: Run Mypy Typecheck
        run: |
          mypy backend/app

      - name: Run Pytest Test Suite
        env:
          MOCK_MODE: "true"
          ENVIRONMENT: "test"
        run: |
          pytest backend/tests -v --durations=10

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript Check
        run: npm run typecheck || npx tsc --noEmit

      - name: Build Frontend
        run: npm run build
